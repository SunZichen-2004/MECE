[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bondnet"
version = "0.1.0"
description = "Primitive edge-centered equivariant interatomic model prototype"
requires-python = ">=3.10"
dependencies = ["torch>=2.1"]

[project.optional-dependencies]
test = ["pytest>=7"]
experiment = ["pyarrow>=15", "psutil>=5"]

[tool.setuptools.packages.find]
include = ["bondnet*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
